name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm ci --prefix scripts
          npm ci --prefix server
          npm ci --prefix client

      # The static export reads the seeded SQLite database, which is not in git.
      # Seeding needs only content/curriculum.json (committed) — the ingest step
      # is skipped here because it parses vendor/, which is not in the repo.
      - name: Seed content database
        run: npm run seed --prefix server

      - name: Export static content
        run: npm run export:static --prefix scripts

      - name: Build client
        run: npm run build --prefix client

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
